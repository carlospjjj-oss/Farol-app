name: Promover versão (canal de teste → todos)
# A versão nova sai como "prévia": só o canal de teste recebe. Depois de 24 h ela vira a versão
# estável (latest) e chega para todos. "Rodar agora" com promover_agora = sim pula a espera.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      promover_agora:
        description: "Promover a prévia mais nova agora, sem esperar 24 h (sim/nao)"
        default: "nao"
permissions:
  contents: write
jobs:
  promover:
    runs-on: ubuntu-latest
    steps:
      - name: Promover prévias com mais de 24 h
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGORA: ${{ github.event.inputs.promover_agora }}
        run: |
          now=$(date +%s)
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=10" \
            --jq '[.[] | select(.prerelease and (.draft|not))] | sort_by(.published_at) | .[] | "\(.id) \(.published_at) \(.name)"' |
          while read id pub name rest; do
            age=$(( now - $(date -d "$pub" +%s) ))
            if [ "$AGORA" = "sim" ] || [ $age -ge 86400 ]; then
              echo "Promovendo $name $rest (publicada há $((age/3600)) h)"
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$id" -F prerelease=false -f make_latest=true >/dev/null
            else
              echo "$name $rest: ainda no canal de teste ($((age/3600)) h)"
            fi
          done
