name: Status do servidor (só leitura)
on:
  push:
    branches: [status]
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar D1 (sem e-mails nem textos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 742459a670c86d97d01450611f86824f
        run: |
          q() { npx -y wrangler@3 d1 execute farol --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "== dias u1 =="
          q "SELECT modo, date, updated_at, data d FROM user_days WHERE user_id=1 AND date >= '2026-11-12' ORDER BY date"
          echo "== u1 eventos desde 00:00 =="
          q "SELECT tipo, app, versao, count(*) n, min(t) primeiro, max(t) ultimo FROM events WHERE user_id=1 AND t >= '2026-11-14T03:00' GROUP BY tipo, app, versao ORDER BY ultimo"
          echo "== u1 dia/pedido =="
          q "SELECT t, tipo, versao, substr(data,1,700) d FROM events WHERE user_id=1 AND tipo IN ('dia','pedido') ORDER BY id DESC LIMIT 6"
