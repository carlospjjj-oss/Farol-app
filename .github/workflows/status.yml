name: Status do servidor (só leitura)
on:
  push:
    branches: [status]
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar D1 (sem e-mails nem textos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 742459a670c86d97d01450611f86824f
        run: |
          q() { npx -y wrangler@3 d1 execute farol --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "== H1 contas: versao e ultimo sinal (tecnico) =="
          q "SELECT user_id, max(versao) v, max(t) ultimo, count(*) n FROM events WHERE received_at > (strftime('%s','now')-86400)*1000 GROUP BY user_id"
          echo "== H2 tipos por conta e app hoje (16/11, sem valores) =="
          q "SELECT user_id, tipo, app, count(*) n FROM events WHERE t >= '2026-11-16' GROUP BY user_id, tipo, app ORDER BY user_id, n DESC"
          echo "== H3 Carlos: ofertas hoje =="
          q "SELECT t, app, json_extract(data,'$.preco') p, json_extract(data,'$.km') km, json_extract(data,'$.min') min, json_extract(data,'$.cor') cor, json_extract(data,'$.porKm') pkm, json_extract(data,'$.why') why FROM events WHERE user_id=1 AND tipo='offer' AND t >= '2026-11-16' ORDER BY id"
          echo "== H4 Carlos: pedidos, ganhos, turno, pausas hoje =="
          q "SELECT t, tipo, app, json_remove(data,'$.texto','$.texto_acessibilidade','$.pacotes_vistos') d FROM events WHERE user_id=1 AND t >= '2026-11-16' AND tipo NOT IN ('offer','tela','saude','ajustes') ORDER BY id LIMIT 80"
          echo "== H5 saude do leitor hoje (contagens) =="
          q "SELECT user_id, t, app, json_extract(data,'$.lidas') lidas, json_extract(data,'$.perdidas') perdidas, json_extract(data,'$.vistas') vistas FROM events WHERE tipo='saude' AND t >= '2026-11-16' ORDER BY id DESC LIMIT 12"
          echo "== H6 travamentos 7 dias =="
          q "SELECT user_id, t, versao, json_extract(data,'$.erro') erro FROM events WHERE tipo='crash' AND received_at > (strftime('%s','now')-7*86400)*1000"
          echo "== H7 Carlos: dia de hoje no diario =="
          q "SELECT date, json_extract(data,'$.earnings') ganhos, json_extract(data,'$.orders') pedidos, json_extract(data,'$.kmStart') kmi, json_extract(data,'$.kmEnd') kmf, json_extract(data,'$.startAt') ini, json_extract(data,'$.endAt') fim FROM user_days WHERE user_id=1 AND date >= '2026-11-15'"
          echo "== fimH =="
