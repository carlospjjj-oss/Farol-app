name: Status do servidor (só leitura)
on:
  push:
    branches: [status]
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar D1 (sem e-mails nem textos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 742459a670c86d97d01450611f86824f
        run: |
          q() { npx -y wrangler@3 d1 execute farol --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "== u1 eventos 13/11 23:00 a 14/11 00:40 (sem textos) =="
          q "SELECT id, t, tipo, app, versao, json_remove(data,'$.texto','$.texto_acessibilidade','$.pacotes_vistos') d FROM events WHERE user_id=1 AND t >= '2026-11-13T23:00' AND t < '2026-11-14T00:40' AND tipo NOT IN ('saude','ajustes') ORDER BY id"
          echo "== u1 tipos nesse intervalo =="
          q "SELECT tipo, app, count(*) n FROM events WHERE user_id=1 AND t >= '2026-11-13T23:00' AND t < '2026-11-14T00:40' GROUP BY tipo, app"
