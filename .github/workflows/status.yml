name: Status do servidor (só leitura)
on:
  push:
    branches: [status]
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar D1 (sem e-mails nem textos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 742459a670c86d97d01450611f86824f
        run: |
          q() { npx -y wrangler@3 d1 execute farol --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "== envios sem conta (user_id nulo) por dia, 30 dias =="
          q "SELECT substr(datetime(received_at/1000,'unixepoch','-3 hours'),1,10) d, count(*) n, count(DISTINCT device) dev, max(versao) v FROM events WHERE user_id IS NULL AND received_at > (strftime('%s','now')-30*86400)*1000 GROUP BY d ORDER BY d"
          echo "== total sem conta =="
          q "SELECT count(*) n, min(t) primeiro, max(t) ultimo FROM events WHERE user_id IS NULL"
          echo "== sessoes por conta (so contagem) =="
          q "SELECT user_id, count(*) n FROM sessions GROUP BY user_id"
          echo "== fim =="
