name: Status do servidor (só leitura)
on:
  push:
    branches: [status]
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar D1 (sem e-mails nem textos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 742459a670c86d97d01450611f86824f
        run: |
          q() { npx -y wrangler@3 d1 execute farol --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "== K1 sync do diario de hoje (so horario) =="
          q "SELECT date, updated_at, datetime(updated_at/1000,'unixepoch','-3 hours') hora FROM user_days WHERE user_id=1 AND date='2026-11-16'"
          q "SELECT max(t) ultimo_evento FROM events WHERE user_id=1"
          echo "== fimH =="
