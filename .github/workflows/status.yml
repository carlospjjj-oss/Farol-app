name: Status do servidor (só leitura)
on:
  push:
    branches: [status]
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar D1 (sem e-mails nem textos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 742459a670c86d97d01450611f86824f
        run: |
          q() { npx -y wrangler@3 d1 execute farol --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "== V1 tecnico 23/11 =="
          q "SELECT versao, count(*) n, min(t) a, max(t) b FROM events WHERE user_id=1 AND t >= '2026-11-23' GROUP BY versao"
          q "SELECT tipo, app, count(*) n FROM events WHERE user_id=1 AND t >= '2026-11-23' GROUP BY tipo, app"
          { q "SELECT t, tipo, app, json_extract(data,'$.cor') cor, json_extract(data,'$.preco') p, json_extract(data,'$.km') km, json_extract(data,'$.texto') texto FROM events WHERE user_id=1 AND t >= '2026-11-23' AND (tipo IN ('offer','miss','pedido') OR data LIKE '%xtra%' OR data LIKE '%+R$%' OR data LIKE '%ncentivo%' OR data LIKE '%Seus ganhos%' OR data LIKE '%conclu%') ORDER BY id"; } > out.txt
          k=$(openssl rand -hex 32)
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass pass:$k -in out.txt | base64 -w0 > c.b64
          echo -n "$k" | openssl pkeyutl -encrypt -pubin -inkey status_pub.pem | base64 -w0 > k.b64
          echo "KEY:$(cat k.b64)"
          echo "DATA:$(cat c.b64)"
          rm -f out.txt
          echo "== fimH =="
