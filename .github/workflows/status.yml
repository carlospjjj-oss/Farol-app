name: Status do servidor (só leitura)
on:
  push:
    branches: [status]
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar D1 (sem e-mails nem textos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 742459a670c86d97d01450611f86824f
        run: |
          q() { npx -y wrangler@3 d1 execute farol --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "== limpeza 6.10.7 =="
          npx -y wrangler@3 d1 execute farol --remote --json --command "SELECT id, data FROM events WHERE tipo IN ('tela','miss','offer') AND (json_extract(data,'$.texto') IS NOT NULL OR json_extract(data,'$.texto_acessibilidade') IS NOT NULL)" > rows.json
          node limpar2.mjs rows.json
          if [ -s limpar.sql ]; then npx -y wrangler@3 d1 execute farol --remote --file limpar.sql --yes > /dev/null && echo aplicado; fi
          echo "== conferencia (contagens) =="
          q "SELECT count(*) n FROM events WHERE data LIKE '%Arroio Grande%' OR data LIKE '%Itamarati%' OR data LIKE '%Isadora%' OR data LIKE '%Magalhães de Castro, 4800%' OR data LIKE '%O4046%'"
          echo "== fimH =="
