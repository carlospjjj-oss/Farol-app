name: Status do servidor (só leitura)
on:
  push:
    branches: [status]
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar D1 (sem e-mails nem textos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 742459a670c86d97d01450611f86824f
        run: |
          q() { npx -y wrangler@3 d1 execute farol --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "== W1 oferta 11:55 =="
          q "SELECT substr(t,12,8) h, json_extract(data,'$.preco') p, json_extract(data,'$.km') km, json_extract(data,'$.min') min, json_extract(data,'$.tempo_estimado') est, json_extract(data,'$.r_km') r_km, json_extract(data,'$.r_h') r_h, json_extract(data,'$.liquido') liq, json_extract(data,'$.cor') cor, json_extract(data,'$.avisos') av FROM events WHERE user_id=1 AND tipo='offer' AND t >= '2026-11-23T11:50' ORDER BY id"
          q "SELECT t, json_extract(data,'$.ajustes.verde_km') vk, json_extract(data,'$.ajustes.amarelo_km') ak, json_extract(data,'$.ajustes.verde_h') vh, json_extract(data,'$.ajustes.amarelo_h') ah, json_extract(data,'$.ajustes.velocidade') vel, json_extract(data,'$.ajustes.velocidade_aprendida') va FROM events WHERE user_id=1 AND tipo='ajustes' ORDER BY id DESC LIMIT 1"
          echo "== fimH =="
