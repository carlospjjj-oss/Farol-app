name: Status do servidor (só leitura)
on:
  push:
    branches: [status]
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar D1 (sem e-mails nem textos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 742459a670c86d97d01450611f86824f
        run: |
          q() { npx -y wrangler@3 d1 execute farol --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "== dias u1 =="
          q "SELECT date, datetime(updated_at/1000,'unixepoch','-3 hours') upd, data d FROM user_days WHERE user_id=1 AND date >= '2026-11-09' ORDER BY date"
          echo "== u1 telas de historico (desde 07:40) =="
          q "SELECT t, app, versao, json_extract(data,'$.fonte') f, substr(json_extract(data,'$.texto'),1,900) tx FROM events WHERE user_id=1 AND tipo='tela' AND t >= '2026-11-14T07:40' ORDER BY id"
          echo "== u1 eventos desde 07:40 =="
          q "SELECT tipo, app, versao, count(*) n FROM events WHERE user_id=1 AND t >= '2026-11-14T07:40' GROUP BY tipo, app, versao"
