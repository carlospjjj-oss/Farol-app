name: Status do servidor (só leitura)
on:
  push:
    branches: [status]
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar D1 (sem e-mails nem textos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 742459a670c86d97d01450611f86824f
        run: |
          q() { npx -y wrangler@3 d1 execute farol --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "== T1 tecnico 20/11 =="
          q "SELECT versao, count(*) n, min(t) a, max(t) b FROM events WHERE user_id=1 AND t >= '2026-11-20' GROUP BY versao"
          q "SELECT tipo, app, count(*) n FROM events WHERE user_id=1 AND t >= '2026-11-20' GROUP BY tipo, app"
          q "SELECT count(*) destino FROM events WHERE user_id=1 AND t >= '2026-11-20' AND data LIKE '%estino definido%'"
          q "SELECT user_id, t, versao, substr(json_extract(data,'$.erro'),1,300) erro FROM events WHERE tipo='crash' AND t >= '2026-11-20'"
          q "SELECT t, json_extract(data,'$.ajustes.ligado') ligado, json_extract(data,'$.ajustes.ocr') ocr FROM events WHERE user_id=1 AND tipo='ajustes' AND t >= '2026-11-20' ORDER BY id DESC LIMIT 2"
          { q "SELECT t, tipo, app, json_extract(data,'$.cor') cor, json_extract(data,'$.preco') p, json_extract(data,'$.km') km, json_extract(data,'$.lucro') lucro, substr(json_extract(data,'$.texto'),1,300) texto FROM events WHERE user_id=1 AND t >= '2026-11-20' AND (tipo IN ('offer','miss') OR data LIKE '%estino definido%') ORDER BY id"; } > out.txt
          k=$(openssl rand -hex 32)
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass pass:$k -in out.txt | base64 -w0 > c.b64
          echo -n "$k" | openssl pkeyutl -encrypt -pubin -inkey status_pub.pem | base64 -w0 > k.b64
          echo "KEY:$(cat k.b64)"
          echo "DATA:$(cat c.b64)"
          rm -f out.txt
          echo "== fimH =="
