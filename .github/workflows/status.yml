name: Status do servidor (só leitura)
on:
  push:
    branches: [status]
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar D1 (sem e-mails nem textos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 742459a670c86d97d01450611f86824f
        run: |
          q() { npx -y wrangler@3 d1 execute farol --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "== X1 tecnico =="
          q "SELECT tipo, count(*) n, min(t) a, max(t) b FROM events WHERE user_id=1 AND t >= '2026-11-23T11:50' GROUP BY tipo"
          { q "SELECT t, tipo, json_remove(data,'$.texto','$.texto_acessibilidade','$.pacotes_vistos','$.ajustes') d FROM events WHERE user_id=1 AND t >= '2026-11-23T11:50' AND tipo IN ('pedido','dia') ORDER BY id"; q "SELECT t, tipo, json_extract(data,'$.fonte') f, substr(json_extract(data,'$.texto'),1,260) texto FROM events WHERE user_id=1 AND app='com.sankuai.sailor.courier' AND tipo='tela' AND t >= '2026-11-23T11:55' ORDER BY id"; q "SELECT json_extract(data,'$.orders') o, json_extract(data,'$.orderAt') oa FROM user_days WHERE user_id=1 AND date='2026-11-23'"; } > out.txt
          k=$(openssl rand -hex 32)
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass pass:$k -in out.txt | base64 -w0 > c.b64
          echo -n "$k" | openssl pkeyutl -encrypt -pubin -inkey status_pub.pem | base64 -w0 > k.b64
          echo "KEY:$(cat k.b64)"
          echo "DATA:$(cat c.b64)"
          rm -f out.txt
          echo "== fimH =="
