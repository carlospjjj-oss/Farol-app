name: Status do servidor (só leitura)
on:
  push:
    branches: [status]
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar D1 (sem e-mails nem textos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 742459a670c86d97d01450611f86824f
        run: |
          q() { npx -y wrangler@3 d1 execute farol --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "== R1 Carlos 19/11 tecnico =="
          q "SELECT versao, count(*) n, min(t) primeiro, max(t) ultimo FROM events WHERE user_id=1 AND t >= '2026-11-19' GROUP BY versao"
          q "SELECT tipo, app, count(*) n FROM events WHERE user_id=1 AND t >= '2026-11-19' GROUP BY tipo, app ORDER BY tipo, app"
          q "SELECT json_extract(data,'$.cor') cor, app, count(*) n FROM events WHERE user_id=1 AND tipo='offer' AND t >= '2026-11-19' GROUP BY cor, app"
          q "SELECT t, tipo, app, json_extract(data,'$.motivo') motivo FROM events WHERE user_id=1 AND t >= '2026-11-19' AND tipo NOT IN ('tela','offer','saude','pedido','ajustes') ORDER BY id"
          q "SELECT user_id, t, versao, substr(json_extract(data,'$.erro'),1,200) erro FROM events WHERE tipo='crash' AND t >= '2026-11-17'"
          q "SELECT date, datetime(updated_at/1000,'unixepoch','-3 hours') sync FROM user_days WHERE user_id=1 AND date >= '2026-11-17' ORDER BY date"
          q "SELECT t, json_extract(data,'$.apps') apps FROM events WHERE user_id=1 AND tipo='saude' AND t >= '2026-11-19' ORDER BY id DESC LIMIT 1"
          q "SELECT user_id, max(t) ultimo FROM events WHERE user_id<>1 GROUP BY user_id"
          q "SELECT user_id, versao, max(t) u FROM events WHERE user_id<>1 AND t >= '2026-11-15' GROUP BY user_id, versao"
          echo "== R2 cifrado =="
          { q "SELECT date, json_extract(data,'$.kmStart') kmi, json_extract(data,'$.kmEnd') kmf, datetime(json_extract(data,'$.startAt')/1000,'unixepoch','-3 hours') ini, datetime(json_extract(data,'$.endAt')/1000,'unixepoch','-3 hours') fim, json_extract(data,'$.earnings') g, json_extract(data,'$.orders') o, json_extract(data,'$.expenses') gastos FROM user_days WHERE user_id=1 AND date >= '2026-11-17' ORDER BY date"; q "SELECT t, app, json_extract(data,'$.preco') p, json_extract(data,'$.km') km, json_extract(data,'$.min') min, json_extract(data,'$.cor') cor, json_extract(data,'$.fonte') f FROM events WHERE user_id=1 AND tipo='offer' AND t >= '2026-11-19' ORDER BY id"; q "SELECT t, json_remove(data,'$.texto','$.texto_acessibilidade','$.pacotes_vistos') d FROM events WHERE user_id=1 AND tipo IN ('pedido','dia','miss') AND t >= '2026-11-19' ORDER BY id"; q "SELECT * FROM user_fuel WHERE user_id=1 AND at > 1795000000000"; q "SELECT t, tipo, json_extract(data,'$.texto') texto FROM events WHERE user_id=1 AND app='com.app99.driver' AND t >= '2026-11-19T16:22:50' AND t <= '2026-11-19T16:23:40' ORDER BY id"; q "SELECT t, tipo, json_extract(data,'$.texto') texto FROM events WHERE user_id=1 AND app='com.app99.driver' AND ((t >= '2026-11-19T17:06:30' AND t <= '2026-11-19T17:07:00') OR (t >= '2026-11-19T18:22:50' AND t <= '2026-11-19T18:23:40')) ORDER BY id"; } > out.txt
          k=$(openssl rand -hex 32)
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass pass:$k -in out.txt | base64 -w0 > c.b64
          echo -n "$k" | openssl pkeyutl -encrypt -pubin -inkey status_pub.pem | base64 -w0 > k.b64
          echo "KEY:$(cat k.b64)"
          echo "DATA:$(cat c.b64)"
          rm -f out.txt
          echo "== fimH =="
