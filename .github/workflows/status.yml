name: Status do servidor (só leitura)
on:
  push:
    branches: [status]
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar D1 (sem e-mails nem textos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 742459a670c86d97d01450611f86824f
        run: |
          q() { npx -y wrangler@3 d1 execute farol --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "== Q1 Carlos tecnico desde 19:30 =="
          q "SELECT versao, count(*) n, min(t) primeiro, max(t) ultimo FROM events WHERE user_id=1 AND t >= '2026-11-16T19:30' GROUP BY versao"
          q "SELECT tipo, app, count(*) n FROM events WHERE user_id=1 AND t >= '2026-11-16T19:30' GROUP BY tipo, app"
          q "SELECT t, tipo, json_extract(data,'$.motivo') motivo, json_extract(data,'$.erro') erro FROM events WHERE user_id=1 AND t >= '2026-11-16T19:30' AND tipo NOT IN ('tela','offer','saude') ORDER BY id"
          q "SELECT user_id, t, versao, substr(json_extract(data,'$.erro'),1,200) erro FROM events WHERE tipo='crash' AND t >= '2026-11-16'"
          q "SELECT date, datetime(updated_at/1000,'unixepoch','-3 hours') sync FROM user_days WHERE user_id=1 AND date >= '2026-11-15' ORDER BY date"
          q "SELECT count(*) n, datetime(max(updated_at)/1000,'unixepoch','-3 hours') ult FROM user_fuel WHERE user_id=1"
          echo "== Q2 cifrado =="
          { q "SELECT * FROM user_fuel WHERE user_id=1 ORDER BY 1 DESC LIMIT 15"; q "SELECT date, json_extract(data,'$.kmStart') kmi, json_extract(data,'$.kmEnd') kmf, json_extract(data,'$.earnings') g, json_extract(data,'$.expenses') gastos FROM user_days WHERE user_id=1 AND date >= '2026-11-08' ORDER BY date"; q "SELECT t, tipo, json_remove(data,'$.texto','$.texto_acessibilidade','$.pacotes_vistos') d FROM events WHERE user_id=1 AND t >= '2026-11-16T19:30' AND tipo IN ('ajustes','dia','combustivel','abastecimento','acao') ORDER BY id"; } > out.txt
          k=$(openssl rand -hex 32)
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass pass:$k -in out.txt | base64 -w0 > c.b64
          echo -n "$k" | openssl pkeyutl -encrypt -pubin -inkey status_pub.pem | base64 -w0 > k.b64
          echo "KEY:$(cat k.b64)"
          echo "DATA:$(cat c.b64)"
          rm -f out.txt
          echo "== fimH =="
