name: Status do servidor (só leitura)
on:
  push:
    branches: [status]
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar D1 (sem e-mails nem textos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 742459a670c86d97d01450611f86824f
        run: |
          q() { npx -y wrangler@3 d1 execute farol --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "== U1 ofertas 99 20/11 (r_km x preco/km) =="
          q "SELECT substr(t,12,8) h, json_extract(data,'$.preco') p, json_extract(data,'$.km') km, json_extract(data,'$.r_km') r_km, round(json_extract(data,'$.preco')/json_extract(data,'$.km'),2) normal_km, json_extract(data,'$.liquido') liq, json_extract(data,'$.cor') cor FROM events WHERE user_id=1 AND tipo='offer' AND app='com.app99.driver' AND t >= '2026-11-20T12' ORDER BY id"
          q "SELECT substr(t,12,8) h FROM events WHERE user_id=1 AND t >= '2026-11-20T12' AND data LIKE '%estino definido%' ORDER BY id"
          q "SELECT max(t) u FROM events WHERE user_id=1"
          echo "== fimH =="
