name: Status do servidor (só leitura)
on:
  push:
    branches: [status]
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar D1 (sem e-mails nem textos)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 742459a670c86d97d01450611f86824f
        run: |
          q() { npx -y wrangler@3 d1 execute farol --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "== N1 Carlos desde 16:40 (tecnico) =="
          q "SELECT t, tipo, app, versao, json_extract(data,'$.motivo') motivo, json_extract(data,'$.fonte') fonte, json_extract(data,'$.cor') cor FROM events WHERE user_id=1 AND t >= '2026-11-16T16:40' AND tipo<>'tela' ORDER BY id"
          q "SELECT app, json_extract(data,'$.fonte') fonte, count(*) n, max(t) ultimo, max(versao) v FROM events WHERE user_id=1 AND tipo='tela' AND t >= '2026-11-16T16:40' GROUP BY app, fonte"
          q "SELECT datetime(updated_at/1000,'unixepoch','-3 hours') sync FROM user_days WHERE user_id=1 AND date='2026-11-16'"
          q "SELECT datetime(max(received_at)/1000,'unixepoch','-3 hours') ultimo_lote FROM batches WHERE user_id=1"
          q "SELECT t, json_extract(data,'$.apps') apps FROM events WHERE user_id=1 AND tipo='saude' ORDER BY id DESC LIMIT 1"
          q "SELECT user_id, t, versao, json_extract(data,'$.erro') erro FROM events WHERE tipo='crash' AND t >= '2026-11-16'"
          q "SELECT user_id, max(versao) v, max(t) ultimo FROM events WHERE user_id<>1 GROUP BY user_id"
          echo "== N2 cifrado =="
          { q "SELECT json_extract(data,'$.earnings') ganhos, json_extract(data,'$.orders') pedidos, json_extract(data,'$.kmStart') kmi, json_extract(data,'$.kmEnd') kmf, json_extract(data,'$.endAt') fim, json_extract(data,'$.expenses') gastos FROM user_days WHERE user_id=1 AND date='2026-11-16'"; q "SELECT t, tipo, app, json_extract(data,'$.preco') p, json_extract(data,'$.km') km, json_extract(data,'$.cor') cor FROM events WHERE user_id=1 AND tipo='offer' AND t >= '2026-11-16T16:40' ORDER BY id"; q "SELECT t, tipo, json_remove(data,'$.texto','$.texto_acessibilidade','$.pacotes_vistos','$.ajustes') d FROM events WHERE user_id=1 AND tipo IN ('pedido','dia') AND t >= '2026-11-16T15:00' ORDER BY id"; q "SELECT t, app, json_extract(data,'$.fonte') fonte, json_extract(data,'$.texto') texto FROM events WHERE user_id=1 AND app='com.app99.driver' AND t >= '2026-11-16T16:40' ORDER BY id"; } > out.txt
          k=$(openssl rand -hex 32)
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass pass:$k -in out.txt | base64 -w0 > c.b64
          echo -n "$k" | openssl pkeyutl -encrypt -pubin -inkey status_pub.pem | base64 -w0 > k.b64
          echo "KEY:$(cat k.b64)"
          echo "DATA:$(cat c.b64)"
          rm -f out.txt
          echo "== fimH =="
