name: Testes no emulador Android
on:
  push:
    branches: [fase1]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Testes unitários + emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            gradle --no-daemon testDebugUnitTest connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
            adb pull /sdcard/Android/data/com.farol.app/files/shots shots || true
      - name: Prints das telas (ramo "prints", para conferir o visual)
        if: always()
        run: |
          [ -d shots ] || exit 0
          mkdir -p /tmp/p && cp shots/*.png /tmp/p/ && cd /tmp/p
          git init -q && git checkout -q -b prints
          git -c user.name=ci -c user.email=ci@farol add -A && git -c user.name=ci -c user.email=ci@farol commit -qm "prints ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" prints
      - name: Relatório
        if: always()
        run: |
          for f in app/build/outputs/androidTest-results/connected/debug/*.xml app/build/outputs/androidTest-results/connected/*.xml; do [ -f "$f" ] && cat "$f"; done; true
